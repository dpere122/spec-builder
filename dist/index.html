<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- CSP: restrict to self and inline styles only; no unsafe-eval or unsafe-inline scripts -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"

    <title>Spec Builder</title>

  <body>
    <div class="container">
      <div class="pane editor-pane">
        <textarea
          id="editor"
          class="editor"
          placeholder="Write your Markdown spec here..."
        ></textarea>
      </div>
      <button
        id="preview-toggle"
        class="preview-toggle"
        title="Toggle preview pane"
        aria-label="Toggle preview pane"
      >
        ▶
      </button>
      <div class="pane preview-pane">
        <div id="preview" class="preview"></div>
      </div>
    </div>
    <!-- Theme picker modal dialog -->
    <div id="theme-modal" class="modal-overlay" style="display: none">
      <div class="modal-content">
        <h2>Choose a Theme</h2>
        <div class="theme-grid">
          <button class="theme-btn" data-theme="light" title="Light theme">
            <div class="theme-swatch light-swatch"></div>
            <div class="theme-preview light-preview">
              <div class="preview-editor">
                <span class="preview-line"># Heading</span>
                <span class="preview-line">**bold** and *italic*</span>
                <span class="preview-line">- list item</span>
              </div>
              <div class="preview-rendered">
                <span class="preview-heading">Heading</span>
                <span class="preview-text">bold and italic</span>
                <span class="preview-list">▸ list item</span>
              </div>
            </div>
            <span>Light</span>
          </button>
          <button class="theme-btn" data-theme="dark" title="Dark theme">

            </div>
            <span>Sepia</span>

    <!-- Find & Replace bar -->
    <div id="find-replace-bar" class="find-replace-bar" style="display: none">
      <div class="find-replace-row">
        <input type="text" id="find-input" placeholder="Find..." />
        <span id="find-count" class="find-count"></span>
        <button id="find-prev" title="Previous">↑</button>
        <button id="find-next" title="Next">↓</button>
        <label class="case-toggle">
          <input type="checkbox" id="find-case-sensitive" />Aa
        </label>
        <button id="find-close" title="Close">✕</button>
      </div>
      <div class="find-replace-row">
        <input type="text" id="replace-input" placeholder="Replace..." />
        <button id="replace-btn">Replace</button>
        <button id="replace-all-btn">All</button>
      </div>
    </div>

    <!-- Custom context menu -->
    <div id="context-menu"></div>
